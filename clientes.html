<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsicoAgenda - Cadastro de Pacientes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

nav{
    background:#6a5acd;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.banner{
    background:linear-gradient(135deg,#6a5acd,#8a2be2);
    color:white;
    text-align:center;
    padding:40px 20px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    margin-bottom:20px;
}

h2{
    color:#6a5acd;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    margin-top:20px;
    background:#6a5acd;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#5b4bc4;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th{
    background:#6a5acd;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:left;
}

.rodape{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>
<body>

<nav>
    <a href="#">Home</a>
    <a href="#">Pacientes</a>
    <a href="#">Especialidades</a>
    <a href="#">Agendamentos</a>
    <a href="#">Consultas</a>
</nav>

<header class="banner">
    <h1>Cadastro de Pacientes</h1>
    <p>Gerencie os pacientes da clínica de forma organizada e segura.</p>
</header>

<div class="container">

    <div class="card">
        <h2>Novo Paciente</h2>

        <form id="formPaciente">

            <label>Nome Completo:</label>
            <input type="text" id="nome" required>

            <label>CPF:</label>
            <input type="text" id="cpf" required>

            <label>Telefone:</label>
            <input type="tel" id="telefone" required>

            <label>E-mail:</label>
            <input type="email" id="email">

            <button type="submit">
                Salvar Paciente
            </button>

        </form>
    </div>

    <div class="card">
        <h2>Pacientes Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                </tr>
            </thead>

            <tbody id="lista-pacientes">
            </tbody>
        </table>
    </div>

</div>

<footer class="rodape">
    <p>© 2026 PsicoAgenda</p>
    <p>Sistema de Agendamento para Psicólogos e Clínicas</p>
</footer>

<script>

const formulario = document.getElementById("formPaciente");
const tabela = document.getElementById("lista-pacientes");

let pacientes = JSON.parse(localStorage.getItem("pacientes")) || [];

function atualizarTabela(){

    tabela.innerHTML = "";

    pacientes.forEach((paciente, indice) => {

        tabela.innerHTML += `
        <tr>
            <td>${paciente.nome}</td>
            <td>${paciente.cpf}</td>
            <td>${paciente.telefone}</td>
            <td>${paciente.email || "-"}</td>
        </tr>
        `;
    });
}

atualizarTabela();

formulario.addEventListener("submit", function(e){

    e.preventDefault();

    const paciente = {
        nome: document.getElementById("nome").value,
        cpf: document.getElementById("cpf").value,
        telefone: document.getElementById("telefone").value,
        email: document.getElementById("email").value
    };

    pacientes.push(paciente);

    localStorage.setItem(
        "pacientes",
        JSON.stringify(pacientes)
    );

    atualizarTabela();

    formulario.reset();

    alert("Paciente cadastrado com sucesso!");
});

</script>

</body>
</html>
