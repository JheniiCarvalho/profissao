<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PsicoAgenda</title>
</head>
<body>

    <!-- Todo o conteúdo da página -->

    <h1>Cadastro de Pacientes</h1>

    <form id="formPaciente">
        <input type="text" id="nome" placeholder="Nome" required>
        <button type="submit">Cadastrar</button>
    </form>

    <table>
        <tbody id="lista-pacientes"></tbody>
    </table>

    <!-- COLOQUE O SCRIPT AQUI, ANTES DO </body> -->
    <script>
        const formulario = document.getElementById("formPaciente");
        const tabela = document.getElementById("lista-pacientes");

        let pacientes =
        JSON.parse(localStorage.getItem("pacientes")) || [];

        function carregarPacientes(){

            tabela.innerHTML = "";

            pacientes.forEach((paciente)=>{

                tabela.innerHTML += `
                    <tr>
                        <td>${paciente.nome}</td>
                    </tr>
                `;
            });
        }

        carregarPacientes();

        formulario.addEventListener("submit", function(e){

            e.preventDefault();

            const paciente = {
                nome: document.getElementById("nome").value
            };

            pacientes.push(paciente);

            localStorage.setItem(
                "pacientes",
                JSON.stringify(pacientes)
            );

            carregarPacientes();

            formulario.reset();
        });
    </script>

</body>
</html>
