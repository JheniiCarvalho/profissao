
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <title>PsicoAgenda - Cadastro de Pacientes</title>
</head>
    <script>

let consultas = [];

function atualizarConsulta(){

    let consulta =
    document.getElementById("selConsulta");

    let valor =
    document.getElementById("txtValor");

    let duracao =
    document.getElementById("txtDuracao");

    switch(consulta.value){

        case "Psicoterapia":
            valor.value = 150;
            duracao.value = 50;
        break;

        case "Terapia de Casal":
            valor.value = 250;
            duracao.value = 90;
        break;

        case "Avaliação Psicológica":
            valor.value = 350;
            duracao.value = 120;
        break;

        default:
            valor.value = "";
            duracao.value = "";
    }

}

function adicionarConsulta(){

    let tipo =
    document.getElementById("selConsulta").value;

    let valor =
    document.getElementById("txtValor").value;

    let duracao =
    document.getElementById("txtDuracao").value;

    if(tipo==""){
        alert("Selecione uma consulta.");
        return;
    }

    consultas.push({
        tipo,
        valor,
        duracao
    });

    atualizarTabela();
}

function atualizarTabela(){

    let tabela =
    document.getElementById("lista-consultas");

    tabela.innerHTML="";

    let total=0;
    let tempo=0;

    consultas.forEach(c=>{

        tabela.innerHTML += `
        <tr>
            <td>${c.tipo}</td>
            <td>${c.duracao} min</td>
            <td>R$ ${Number(c.valor).toFixed(2)}</td>
        </tr>
        `;

        total += Number(c.valor);
        tempo += Number(c.duracao);

    });

    document.getElementById("txtTotal").innerHTML =
    "Valor Total: R$ "+total.toFixed(2);

    document.getElementById("txtTempoTotal").innerHTML =
    "Tempo Total: "+tempo+" min";

}

function salvarConsulta(){

    if(consultas.length==0){

        alert("Adicione uma consulta.");

        return;
    }

    localStorage.setItem(
        "consultas",
        JSON.stringify(consultas)
    );

    alert("Agendamento salvo com sucesso!");

}

window.onload=function(){

    let select =
    document.getElementById("selConsulta");

    select.innerHTML=`
        <option value="">Selecione...</option>
        <option>Psicoterapia</option>
        <option>Terapia de Casal</option>
        <option>Avaliação Psicológica</option>
    `;

}

</script>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Pacientes</a>
        <a href="servicos.html">Especialidades</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consultas.html">Consultas</a>
    </nav>

    
<header class="banner">
    <h1>Agendamento de Consultas</h1>
    <p>Organize consultas psicológicas de forma prática e eficiente</p>
</header>

<div class="container">

    <div style="margin-bottom:20px;">
        <button onclick="alert('Página Histórico de Consultas ainda não foi criada.')">
            📋 Histórico de Consultas
        </button>
    </div>

    <div class="card">
        <h2>Novo Agendamento</h2>

        <label for="selPaciente">Paciente:</label>
        <select id="selPaciente">
            <option value="">Selecione o paciente...</option>
        </select>

        <label for="data_consulta">Data e Hora da Consulta:</label>
        <input type="datetime-local" id="data_consulta">

        <label for="psicologo">Psicólogo Responsável:</label>
        <input type="text" id="psicologo"
               placeholder="Ex: Dra. Maria Silva">

        <hr>

        <h3>🧠 Tipo de Atendimento</h3>

        <label for="selConsulta">Tipo de Consulta:</label>
        <select id="selConsulta" onchange="atualizarConsulta()">
            <option value="">Selecione...</option>
        </select>

        <div style="display:flex; gap:15px; margin-top:10px;">

            <div style="flex:1;">
                <label>Valor da Consulta (R$)</label>
                <input type="number"
                       id="txtValor"
                       readonly>
            </div>

            <div style="flex:1;">
                <label>Duração (Minutos)</label>
                <input type="number"
                       id="txtDuracao"
                       readonly>
            </div>

        </div>

        <button type="button"
                onclick="adicionarConsulta()"
                style="margin-top:15px;">
            ➕ Adicionar Consulta
        </button>
    </div>

    <div class="card" style="margin-top:20px;">

        <h2>Consultas Agendadas</h2>

        <table>
            <thead>
                <tr>
                    <th>Consulta</th>
                    <th>Duração</th>
                    <th>Valor</th>
                </tr>
            </thead>

            <tbody id="lista-consultas">
            </tbody>
        </table>

        <div style="text-align:right; margin-top:15px;">
            <h3 id="txtTotal">
                Valor Total: R$ 0,00
            </h3>

            <h4 id="txtTempoTotal">
                Tempo Total: 0 min
            </h4>
        </div>

        <button type="button"
                onclick="salvarConsulta()">
            💾 Confirmar Agendamento
        </button>

    </div>
