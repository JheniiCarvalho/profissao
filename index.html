<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema para Psicólogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Sistema de Agendamento para Psicólogos</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Clientes</a>
    <a href="#">Serviços</a>
    <a href="#">Agendamento</a>
    <a href="#">Consultas</a>
</nav>

<main>
    <section class="card">
        <h2>Home</h2>
        <p>Bem-vindo ao sistema de gerenciamento psicológico.</p>
    </section>

    <section class="card">
        <h2>Clientes</h2>
        <input type="text" placeholder="Nome do cliente">
        <button>Cadastrar</button>
    </section>

    <section class="card">
        <h2>Agendamento</h2>
        <input type="date">
        <input type="time">
        <button>Agendar</button>
    </section>
</main>

</body>
</html>
